name: first-github workflow

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: Welcome message
              run: |
                echo "My first Github actions workflow"
                sleep 30

    second_job:
        runs-on: ubuntu-latest
        steps:
            - name: List files
              run: ls

            - name: create file
              run: touch README.md

            - name: read file
              run: cat README.md