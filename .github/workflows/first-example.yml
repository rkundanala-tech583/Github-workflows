name: first-github workflow

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: Welcome message
              run: |
                touch mytestrk.txt
                echo mytestrk.txt > My first Github actions workflow
                sleep 30
                
            - uses: actions/upload-artifact@v7
              with:
                name: my-artifact
                path: mytestrk.txt

    second_job:
        runs-on: ubuntu-latest
        needs: first_job
        steps:
          - uses: actions/download-artifact@v8
            with:
              name: my-artifact
          - name: Display structure of downloaded files
            run: ls -R

          - name: read file
            run: cat mytestrk.txt